---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-commerce-web
  labels:
    app.kubernetes.io/name: bizpark-commerce-web
    app.kubernetes.io/component: commerce-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-commerce-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-commerce-web
        app.kubernetes.io/component: commerce-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: commerce-web
          image: ghcr.io/codesprint-bizspark/bizpark-commerce-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          env:
            # Resolve tenant subdomains (<slug>.bizspark.online) via the API,
            # in-cluster (no external round-trip).
            - name: INTERNAL_API_URL
              value: "http://bizpark-api:3000"
            # Server-side storefront SSR fetches the commerce API in-cluster
            # (NOT commerce.bizspark.online through Cloudflare) to avoid an
            # external round-trip on every dynamic render.
            - name: INTERNAL_COMMERCE_URL
              value: "http://bizpark-commerce:3003"
          envFrom:
            - secretRef:
                name: bizpark-runtime-env
          # Cap resources so a render spike can never starve the single node
          # (which previously took down admin/commerce/mcp via probe timeouts).
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-mcp
  labels:
    app.kubernetes.io/name: bizpark-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-mcp
        app.kubernetes.io/component: mcp
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: mcp
          # Pinned to the OAuth-capable build (CI update-infra was flaking on
          # unrelated services, so pin by tag like the frontend).
          image: ghcr.io/codesprint-bizspark/bizpark-mcp:sha-5b59d8d364f81e3d2a0645750824f348b7eed59f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3005
          env:
            - name: MCP_PORT
              value: "3005"
            # Public base URL advertised in the SSE `endpoint` event so remote
            # MCP clients (Claude Desktop via mcp-remote) POST messages back to
            # the public domain, not localhost.
            - name: MCP_PUBLIC_URL
              value: "https://admin.bizspark.online"
          envFrom:
            - secretRef:
                name: bizpark-runtime-env
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-runner
  labels:
    app.kubernetes.io/name: bizpark-runner
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-runner
        app.kubernetes.io/component: runner
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: runner
          image: ghcr.io/codesprint-bizspark/bizpark-runner:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            # AI fallback keys (Gemini → MiniMax → OpenAI) come from the
            # SealedSecret bizpark-runtime-env.
            - secretRef:
                name: bizpark-runtime-env
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-frontend
  labels:
    app.kubernetes.io/name: bizpark-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-frontend
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          # Pinned to a unique build tag so the node pulls the new image (CI also
          # publishes :latest; add INFRA_REPO_TOKEN to auto-pin future builds).
          image: ghcr.io/codesprint-bizspark/bizpark-frontend:sha-ae9ac4972dc513f5208e0070b9c7d43538cceb7b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
