apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-api
  labels:
    app.kubernetes.io/name: bizpark-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-api
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/codesprint-bizspark/bizpark-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # All runtime config + secrets (public URLs, social OAuth, billing,
            # provider keys) live in the SealedSecret bizpark-runtime-env.
            - secretRef:
                name: bizpark-runtime-env
          env:
            # The Instagram app ID is PUBLIC (it travels in the OAuth URL), not a
            # secret. The sealed value carried a stale id; this explicit env wins
            # over envFrom and pins the correct Business_App-IG Instagram app id.
            - name: INSTAGRAM_APP_ID
              value: "1900920880580090"
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
---
