apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-api
  labels:
    app.kubernetes.io/name: bizpark-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-api
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/codesprint-bizspark/bizpark-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: bizpark-runtime-env
          # Public storefront base for generated "view your store" links.
          # Explicit env overrides the value from the secret.
          env:
            - name: COMMERCE_WEB_URL
              value: "https://store.bizspark.randitha.net"
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
---
