apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-frontend
  labels:
    app.kubernetes.io/name: bizpark-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-frontend
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          # Pinned to a unique build tag so the node pulls the new image (CI also
          # publishes :latest; add INFRA_REPO_TOKEN to auto-pin future builds).
          image: ghcr.io/codesprint-bizspark/bizpark-frontend:sha-3f04fbf1929f02ce36408557e1132f29bce7278c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
