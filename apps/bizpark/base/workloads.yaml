apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-api
  labels:
    app.kubernetes.io/name: bizpark-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-api
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/codesprint-bizspark/bizpark-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # All runtime config + secrets (public URLs, social OAuth, billing,
            # provider keys) live in the SealedSecret bizpark-runtime-env.
            - secretRef:
                name: bizpark-runtime-env
          env:
            # The Instagram app ID is PUBLIC (it travels in the OAuth URL), not a
            # secret. The sealed value carried a stale id; this explicit env wins
            # over envFrom and pins the correct Business_App-IG Instagram app id.
            - name: INSTAGRAM_APP_ID
              value: "1900920880580090"
            # Cloudflare DNS — auto-create per-tenant storefront subdomains.
            # Zone id + base domain are not secret. The DNS:Edit token comes from
            # the out-of-band Secret `cloudflare-api` (created once via kubectl,
            # like cf-origin-cert/ghcr-pull-secret) — the sealed-secret entry
            # failed to decrypt (scope mismatch), so we reference a plain Secret.
            - name: CLOUDFLARE_ZONE_ID
              value: "47d2bcd4c32d454506f12e8ab2bfdf25"
            - name: BIZSPARK_BASE_DOMAIN
              value: "bizspark.online"
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api
                  key: token
            # Supabase Storage (media uploads). NOTE: ACCESS_KEY_ID + SECRET are
            # credentials — rotate and move into the SealedSecret when possible.
            - name: SUPABASE_PROJECT_URL
              value: "https://yquddwqsccbehsmradkh.supabase.co"
            - name: SUPABASE_STORAGE_BUCKET
              value: "BizSpark"
            - name: SUPABASE_STORAGE_S3_ENDPOINT
              value: "https://yquddwqsccbehsmradkh.storage.supabase.co/storage/v1/s3"
            - name: SUPABASE_STORAGE_REGION
              value: "ap-northeast-1"
            - name: SUPABASE_STORAGE_ACCESS_KEY_ID
              value: "44faea747221984407e26928ec99d643"
            - name: SUPABASE_STORAGE_SECRET_ACCESS_KEY
              value: "24b7a864e4133303dd9fd6b1ae20db2806738e2cca2865a613b7989de9cba1fb"
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
---
