apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizpark-api
  labels:
    app.kubernetes.io/name: bizpark-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bizpark-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizpark-api
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/codesprint-bizspark/bizpark-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: bizpark-runtime-env
          # Public URLs + feature config (domain). Explicit env overrides the secret.
          env:
            - name: COMMERCE_WEB_URL
              value: "https://store.randitha.net"
            - name: PUBLIC_API_URL
              value: "https://bizspark.randitha.net"
            - name: FRONTEND_URL
              value: "https://bizspark.randitha.net"
            # Social OAuth callbacks (HTTPS domain — also register in Meta app)
            - name: FACEBOOK_REDIRECT_URI
              value: "https://bizspark.randitha.net/api/social/accounts/callback"
            - name: INSTAGRAM_REDIRECT_URI
              value: "https://bizspark.randitha.net/api/social/accounts/callback"
            # Instagram app (separate from the Facebook app)
            - name: INSTAGRAM_APP_ID
              value: "1900920880580090"
            - name: INSTAGRAM_APP_SECRET
              value: "aa42ba35441bed628e98c15c7ebad03b"
            # Google Reviews demo (mock connect)
            - name: GOOGLE_BUSINESS_PROVIDER
              value: "mock"
            # Billing (PayHere sandbox). Uncomment + set the secret to enable checkout.
            - name: PAYHERE_MERCHANT_ID
              value: "1236046"
            - name: PAYHERE_SANDBOX
              value: "true"
            # - name: PAYHERE_MERCHANT_SECRET
            #   value: "<your PayHere sandbox merchant secret>"
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
---
