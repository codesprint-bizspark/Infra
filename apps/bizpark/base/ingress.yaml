apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bizpark-master-ingress
  namespace: bizpark
  annotations:
    # Serve on both HTTP (raw-IP access) and HTTPS (domain via Cloudflare)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  # cf-origin-cert is served to Cloudflare; with SSL mode = Full, Cloudflare does
  # not validate it, so 1-level hosts (covered by free *.randitha.net edge cert) work.
  tls:
  - hosts:
    - "bizspark.randitha.net"
    - "store.randitha.net"
    - "commerce.randitha.net"
    - "admin.randitha.net"
    # New domain (added alongside; Cloudflare SSL mode Full doesn't validate origin cert)
    - "bizspark.online"
    - "store.bizspark.online"
    - "commerce.bizspark.online"
    - "admin.bizspark.online"
    secretName: cf-origin-cert
  rules:
  # Apex → SaaS dashboard (frontend), with API on the same origin (/api)
  - host: "bizspark.randitha.net"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bizpark-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-frontend
            port:
              number: 3000
  # Commerce API (products, mobile config)
  - host: "commerce.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce
            port:
              number: 3003
  # Admin panel + MCP server (SSE + OAuth) for AI Connect
  - host: "admin.randitha.net"
    http:
      paths:
      - path: /sse
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /message
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      # Streamable HTTP transport for claude.ai web connectors
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      # OAuth for claude.ai web connectors (discovery + authorize/token/register)
      - path: /.well-known/oauth-authorization-server
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /.well-known/oauth-protected-resource
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /oauth
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-admin
            port:
              number: 3002
  # Storefront (commerce-web; tenant via ?tenant=<slug> or cookie)
  - host: "store.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce-web
            port:
              number: 3004
  # ──────────────────────────────────────────────────────────────────────────
  # bizspark.online — new domain, same services, added ALONGSIDE randitha.net.
  # Apex → SaaS dashboard (frontend) + API on same origin (/api).
  - host: "bizspark.online"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bizpark-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-frontend
            port:
              number: 3000
  # Commerce API
  - host: "commerce.bizspark.online"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce
            port:
              number: 3003
  # Admin panel + MCP server (SSE + OAuth)
  - host: "admin.bizspark.online"
    http:
      paths:
      - path: /sse
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /message
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /.well-known/oauth-authorization-server
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /.well-known/oauth-protected-resource
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /oauth
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-admin
            port:
              number: 3002
  # Storefront (commerce-web)
  - host: "store.bizspark.online"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce-web
            port:
              number: 3004
  # Host-less catch-all → raw-IP access to dashboard + API
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bizpark-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-frontend
            port:
              number: 3000
---
# Per-tenant storefront subdomains: <slug>.bizspark.online → commerce-web.
# A SEPARATE ingress with an explicitly LOW router priority, so the exact-host
# rules in bizpark-master-ingress (commerce/admin/store/bizspark.bizspark.online)
# always win; only un-matched tenant slugs fall through to this wildcard. These
# hosts hit the VM directly (DNS-only wildcard) and are served the Let's Encrypt
# *.bizspark.online cert (cert-manager), not cf-origin-cert.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bizpark-tenant-ingress
  namespace: bizpark
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  tls:
  - hosts:
    - "*.bizspark.online"
    secretName: bizspark-wildcard-tls
  rules:
  - host: "*.bizspark.online"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce-web
            port:
              number: 3004
