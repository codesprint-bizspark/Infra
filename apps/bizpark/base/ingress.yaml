apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bizpark-master-ingress
  namespace: bizpark
  annotations:
    # Serve on both HTTP (raw-IP access) and HTTPS (domain via Cloudflare)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  # Attach the Cloudflare certificate
  tls:
  - hosts:
    - "api.bizspark.randitha.net"
    - "admin.bizspark.randitha.net"
    - "commerce.bizspark.randitha.net"
    - "bizspark.randitha.net"
    # Storefront: default host + per-tenant subdomains
    - "store.bizspark.randitha.net"
    - "*.bizspark.randitha.net"
    secretName: cf-origin-cert
  rules:
  - host: "api.bizspark.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-api
            port:
              number: 3000
  - host: "admin.bizspark.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-admin
            port:
              number: 3002

      # MCP server (SSE transport) — AI Connect for customers
      - path: /sse
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /message
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005

  - host: "commerce.bizspark.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce
            port:
              number: 3003
  # Apex domain → SaaS dashboard (frontend), with the API on the same origin (/api)
  - host: "bizspark.randitha.net"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bizpark-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-frontend
            port:
              number: 3000
  # Storefront default host (commerce-web; tenant via ?tenant=<slug> or cookie).
  - host: "store.bizspark.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce-web
            port:
              number: 3004
  # Per-tenant subdomains → customer storefronts (commerce-web reads the tenant
  # from the subdomain label). Specific hosts above take precedence over this.
  - host: "*.bizspark.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce-web
            port:
              number: 3004
  # Host-less catch-all → lets raw-IP (http://<node-ip>) reach the dashboard + API
  # on the same origin. Lowest priority; named hosts above always win.
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bizpark-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-frontend
            port:
              number: 3000
