apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bizpark-master-ingress
  namespace: bizpark
  annotations:
    # Force Traefik to listen securely on HTTPS
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  # Attach the Cloudflare certificate
  tls:
  - hosts:
    - "api.bizspark.randitha.net"
    - "admin.bizspark.randitha.net"
    - "commerce.bizspark.randitha.net"
    - "bizspark.randitha.net"
    secretName: cf-origin-cert
  rules:
  - host: "api.bizspark.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-api
            port:
              number: 3000
  - host: "admin.bizspark.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-admin
            port:
              number: 3002

      # MCP server (SSE transport) — AI Connect for customers
      - path: /sse
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005
      - path: /message
        pathType: Prefix
        backend:
          service:
            name: bizpark-mcp
            port:
              number: 3005

  - host: "commerce.bizspark.randitha.net"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce
            port:
              number: 3003
  - host: "bizspark.randitha.net"
    http:
      paths:

      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce-web
            port:
              number: 3004
