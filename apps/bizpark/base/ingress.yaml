apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bizpark-ingress
  namespace: bizpark
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /api/commerce
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce
            port:
              number: 3003
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bizpark-api
            port:
              number: 3000
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: bizpark-admin
            port:
              number: 3002
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bizpark-commerce-web
            port:
              number: 3004
